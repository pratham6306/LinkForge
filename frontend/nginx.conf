server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend with DNS resolver and TLS SNI for Render deployment
    location /api/ {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://linkforge-backend.onrender.com/api/;
        proxy_set_header Host linkforge-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name linkforge-backend.onrender.com;
    }
}
