services:
  - type: web
    name: linkforge-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: linkforge-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free

databases:
  - name: db
    plan: free
    databaseName: url_shortener
    user: url_shortener_user
