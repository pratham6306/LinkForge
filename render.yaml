services:
  - type: web
    name: linkforge-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://linkforge-backend.onrender.com

  - type: web
    name: linkforge-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://linkforge-backend.onrender.com

databases:
  - name: linkforge-db
    plan: free
    databaseName: url_shortener
    user: url_shortener_user
